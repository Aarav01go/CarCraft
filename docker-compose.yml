version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: carcraft-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: carcraftroot
      MYSQL_DATABASE: carcraft
      MYSQL_USER: carcraft_user
      MYSQL_PASSWORD: carcraftpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: carcraft-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=carcraft
      - DB_USER=carcraft_user
      - DB_PASSWORD=carcraftpass
      - DB_HOST=db
      - DB_PORT=3306
      - DEBUG=True
    depends_on:
      - db

volumes:
  mysql_data:
